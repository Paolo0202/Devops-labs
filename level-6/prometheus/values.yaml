prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    additionalScrapeConfigs:
      - job_name: "flask-app"
        static_configs:
          - targets: ["flask-app.default.svc.cluster.local:5001"]

grafana:
  adminPassword: admin
  service:
    type: ClusterIP

alertmanager:
  enabled: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
