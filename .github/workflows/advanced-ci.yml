
name: Advanced CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: level-1/app

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('level-1/app/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: pip install flake8 && flake8 app.py --max-line-length=100

      - name: Verify import
        run: python -c "import flask; print(f'Flask {flask.__version__} OK')"

      - name: Build Docker image
        run: docker build -t flask-app:ci .

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: level-1/app

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          IMAGE_NAME=ghcr.io/paolo0202/devops-labs-flask-app
          SHA_TAG=${{ github.sha }}
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$SHA_TAG .
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$SHA_TAG
