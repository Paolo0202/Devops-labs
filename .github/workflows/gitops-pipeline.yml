name: GitOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "level-1/app/**"

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: level-1/app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: pip install flake8 && flake8 app.py --max-line-length=100

      - name: Verify import
        run: python -c "import flask; print(f'Flask {flask.__version__} OK')"

  publish:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: level-1/app

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          IMAGE_NAME=ghcr.io/paolo0202/devops-labs-flask-app
          SHA_TAG=${GITHUB_SHA}
          docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:$SHA_TAG" .
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$SHA_TAG"

  update-manifest:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update deployment image
        run: |
          IMAGE="ghcr.io/paolo0202/devops-labs-flask-app:${GITHUB_SHA}"
          sed -i "s|image:.*devops-labs-flask-app.*|image: $IMAGE|" level-2/manifests/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add level-2/manifests/deployment.yaml
          git commit -m "chore: update image to ${GITHUB_SHA} [skip ci]"
          git push
